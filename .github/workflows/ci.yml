name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.3.15
          sha256: 9d6e5dc766f0cab6836a07110114fbe788eff3346f1a39734995e1960ac449c1
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  mockportal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mockportal
    steps:
      - *checkout
      - *mise
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check that the committed dist matches the build
        run: git diff --exit-code -- ../internal/mockportal/dist
      # Picked up by dependabot-dist.yml, which commits it to the pull request.
      - if: failure() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mockportal-dist
          path: internal/mockportal/dist
          retention-days: 1
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *mise
      - run: testenv/e2e.sh
