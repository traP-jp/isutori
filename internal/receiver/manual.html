<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>isutori: {{.RunID}}</title>
<style>
body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
label { display: block; margin: 1rem 0 .25rem; }
textarea { width: 100%; height: 16rem; }
</style>
</head>
<body>
<h1>ベンチ結果の手動入力</h1>
<p>run: <code>{{.RunID}}</code></p>
<p>ポータルでベンチを Enqueue し、終わったら結果をここに入力してください。</p>
<form id="f">
<label><input type="checkbox" name="passed"> Passed</label>
<label>Score <input type="number" name="score" value="0" required></label>
<label>メッセージ (ポータルの表示をそのまま貼り付け)</label>
<textarea name="message"></textarea>
<p><button>送信</button> <span id="status"></span></p>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const res = await fetch("/api/manual-result", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      run_id: {{.RunID}},
      passed: f.passed.checked,
      score: Number(f.score.value),
      message: f.message.value,
    }),
  });
  document.getElementById("status").textContent = res.ok ? "送信しました。このタブは閉じて構いません。" : `失敗: ${await res.text()}`;
});
</script>
</body>
</html>
